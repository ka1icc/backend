<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <h1>URL Shortener</h1>
    <p class="subtitle">Создайте короткую ссылку</p>

    <form id="shortenForm">
      <div class="form-group">
        <input
          type="text"
          id="targetUrl"
          placeholder="Введите URL"
          required
        >
      </div>
      <button type="submit" id="submitBtn">Создать короткую ссылку</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
